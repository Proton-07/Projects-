<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bootstrap Grid Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="bg-primary text-white text-center p-4">
    <h1>ABC University</h1>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">ABC University</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <div class="navbar-nav">
                <a class="nav-link" href="#">Home</a>
                <a class="nav-link" href="#courses">Courses</a>
                <a class="nav-link" href="#contact">Contact</a>
            </div>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="row g-3">
        <div class="col-12 col-md-4">
            <div class="bg-light p-4">
                <h3>About Us</h3>
                <p>We provide quality education.</p>
                <a href="#contact" class="btn btn-primary">Learn More</a>
            </div>
        </div>

        <div class="col-12 col-md-8" id="courses">
            <div class="bg-light p-4">
                <h3>Our Courses</h3>
                <div class="row g-2">
                    <div class="col-6"><div class="bg-info p-3">Computer Science</div></div>
                    <div class="col-6"><div class="bg-info p-3">Electronics</div></div>
                    <div class="col-6"><div class="bg-info p-3">Mechanical</div></div>
                    <div class="col-6"><div class="bg-info p-3">Civil</div></div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer id="contact" class="bg-dark text-white text-center p-3">
    Contact: abc@university.com
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
