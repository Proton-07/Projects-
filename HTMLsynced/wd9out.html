
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Alert</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
            background-color: #f0f4f8;
        }

        button {
            padding: 12px 25px;
            background-color: #176b87;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #104b60;
        }
    </style>
</head>

<body>

    <h1>JavaScript Alert Example</h1>

    <p>Click the button to display an alert message.</p>

    <button onclick="showMessage()">Click Me</button>

    <script>
        function showMessage() {
            alert("Welcome to my webpage!");
        }
    </script>

</body>
</html>
