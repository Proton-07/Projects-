
<!DOCTYPE html>
<html>
<head>
    <title>University Homepage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #eef2f3;
        }

        header, footer {
            background: #12345a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #176b87;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        .courses {
            display: flex;
            gap: 15px;
            padding: 20px;
        }

        .course {
            background: white;
            padding: 20px;
            flex: 1;
        }

        @media (max-width: 600px) {
            .courses {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Future University</h1>
        <p>Knowledge and Innovation</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#courses">Courses</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <h2>  Welcome to Our University</h2>
        <p>We provide quality education and technical skills.</p>

        <div class="courses" id="courses">
            <div class="course">
                <h3>Computer Science</h3>
                <p>Learn programming and technology.</p>
            </div>

            <div class="course">
                <h3>Engineering</h3>
                <p>Develop technical skills.</p>
            </div>
        </div>

        <p id="contact">Email: info@futureuniversity.example</p>
    </main>

    <footer>
        Future University
    </footer>

</body>
</html>
